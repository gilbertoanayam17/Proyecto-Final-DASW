<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendorx - Vista Semanal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/monthly_view.css">
    <link rel="stylesheet" href="../assets/weekly_view.css">
</head>
<body>

    <nav class="navbar navbar-custom px-4 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center" style="width: 260px;">
            <i class="bi bi-calendar-event fs-3 me-2"></i>
            <span class="fs-4 fw-bold">Calendorx</span>
        </div>
        <div class="d-flex align-items-center">
            <a href="#" class="text-decoration-none text-white me-4 d-flex align-items-center">
                <i class="bi bi-search me-1"></i> Buscar
            </a>
            <div class="d-flex align-items-center me-4 text-white">
                <i class="bi bi-person fs-5 me-2"></i>
                <span class="fw-medium">Nombre del usuario xd</span>
            </div>
            <button class="btn btn-logout d-flex align-items-center rounded-pill border-0 px-3 py-2">
                <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
            </button>
        </div>
    </nav>

    <div class="d-flex">
        <aside class="sidebar p-4">
            <div class="date-card mb-4 shadow-sm">
                <div class="day-number">21</div>
                <div class="month-year">Abril 2026</div>
            </div>

            <div class="sidebar-heading">VISTAS</div>
            <ul class="nav flex-column mb-4">
                <li class="nav-item">
                    <a class="nav-link" href="monthly_view.html">
                        <i class="bi bi-calendar3 me-3"></i> Mes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active-blue shadow-sm" href="#">
                        <i class="bi bi-calendar-week me-3"></i> Semana
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="daily_view.html">
                        <i class="bi bi-calendar-day me-3"></i> Día
                    </a>
                </li>
            </ul>

            <div class="sidebar-heading">FILTROS</div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active-cyan shadow-sm" href="#">
                        <i class="bi bi-funnel me-3"></i> Vista Normal
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-bell me-3"></i> Solo Recordatorios
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-heart me-3"></i> Solo Fechas Importantes
                    </a>
                </li>
            </ul>
        </aside>

        <main class="main-content p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center mb-4 title-section">
                <div>
                    <h2 class="h3 mb-1">Vista Semanal</h2>
                    <p class="text-secondary mb-0 d-flex align-items-center">
                        <i class="bi bi-calendar2-grid text-primary me-2"></i>
                        13 abr – 19 abr 2026
                    </p>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="week-nav d-flex align-items-center gap-2">
                        <button class="btn btn-week-nav" id="prevWeek">
                            <i class="bi bi-chevron-left"></i>
                        </button>
                        <button class="btn btn-today">Hoy</button>
                        <button class="btn btn-week-nav" id="nextWeek">
                            <i class="bi bi-chevron-right"></i>
                        </button>
                    </div>
                    <button class="btn btn-new-event border-0 shadow-sm">
                        <i class="bi bi-plus-lg me-1"></i> Nuevo Evento
                    </button>
                </div>
            </div>

            <div class="calendar-card">
                <!-- Header días de la semana -->
                <div class="week-header-grid">
                    <div class="week-time-gutter"></div>
                    <div class="week-day-header" id="day-0">
                        <span class="day-name">DOM</span>
                        <span class="day-num">13</span>
                    </div>
                    <div class="week-day-header today-header" id="day-1">
                        <span class="day-name">LUN</span>
                        <span class="day-num today-num">14</span>
                    </div>
                    <div class="week-day-header" id="day-2">
                        <span class="day-name">MAR</span>
                        <span class="day-num">15</span>
                    </div>
                    <div class="week-day-header" id="day-3">
                        <span class="day-name">MIÉ</span>
                        <span class="day-num">16</span>
                    </div>
                    <div class="week-day-header" id="day-4">
                        <span class="day-name">JUE</span>
                        <span class="day-num">17</span>
                    </div>
                    <div class="week-day-header" id="day-5">
                        <span class="day-name">VIE</span>
                        <span class="day-num">18</span>
                    </div>
                    <div class="week-day-header" id="day-6">
                        <span class="day-name">SÁB</span>
                        <span class="day-num">19</span>
                    </div>
                </div>

                <!-- Cuerpo con horas -->
                <div class="week-body-scroll">
                    <div class="week-body-grid" id="weekBody">
                        <!-- Generado por JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const hours = [];
        for (let h = 0; h < 24; h++) {
            hours.push(h.toString().padStart(2, '0') + ':00');
        }

        function buildGrid() {
            const body = document.getElementById('weekBody');
            body.innerHTML = '';
            hours.forEach(hour => {
                // Celda de hora
                const timeCell = document.createElement('div');
                timeCell.className = 'week-time-cell';
                timeCell.textContent = hour;
                body.appendChild(timeCell);

                // 7 celdas de días
                for (let d = 0; d < 7; d++) {
                    const cell = document.createElement('div');
                    cell.className = 'week-cell';
                    const addBtn = document.createElement('span');
                    addBtn.className = 'add-event-hint';
                    addBtn.textContent = '+ Agregar';
                    cell.appendChild(addBtn);
                    body.appendChild(cell);
                }
            });
        }

        buildGrid();

        // Scroll al horario actual (~08:00)
        document.querySelector('.week-body-scroll').scrollTop = 8 * 60;
    </script>
</body>
</html>
