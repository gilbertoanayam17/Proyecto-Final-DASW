<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendorx - Vista Diaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/monthly_view.css">
    <link rel="stylesheet" href="../assets/weekly_view.css">
</head>
<body>

    <nav class="navbar navbar-custom px-4 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center" style="width: 260px;">
            <i class="bi bi-calendar-event fs-3 me-2"></i>
            <span class="fs-4 fw-bold">Calendorx</span>
        </div>
        <div class="d-flex align-items-center">
            <a href="#" class="text-decoration-none text-white me-4 d-flex align-items-center">
                <i class="bi bi-search me-1"></i> Buscar
            </a>
            <div class="d-flex align-items-center me-4 text-white">
                <i class="bi bi-person fs-5 me-2"></i>
                <span class="fw-medium">Nombre del usuario xd</span>
            </div>
            <button class="btn btn-logout d-flex align-items-center rounded-pill border-0 px-3 py-2">
                <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
            </button>
        </div>
    </nav>

    <div class="d-flex">
        <aside class="sidebar p-4">
            <div class="date-card mb-4 shadow-sm">
                <div class="day-number">21</div>
                <div class="month-year">Abril 2026</div>
            </div>

            <div class="sidebar-heading">VISTAS</div>
            <ul class="nav flex-column mb-4">
                <li class="nav-item">
                    <a class="nav-link" href="monthly_view.html">
                        <i class="bi bi-calendar3 me-3"></i> Mes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="weekly_view.html">
                        <i class="bi bi-calendar-week me-3"></i> Semana
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active-blue shadow-sm" href="#">
                        <i class="bi bi-calendar-day me-3"></i> Día
                    </a>
                </li>
            </ul>

            <div class="sidebar-heading">FILTROS</div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active-cyan shadow-sm" href="#">
                        <i class="bi bi-funnel me-3"></i> Vista Normal
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-bell me-3"></i> Solo Recordatorios
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-heart me-3"></i> Solo Fechas Importantes
                    </a>
                </li>
            </ul>
        </aside>

        <main class="main-content p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center mb-4 title-section">
                <div>
                    <h2 class="h3 mb-1">Vista Diaria</h2>
                    <p class="text-secondary mb-0 d-flex align-items-center">
                        <i class="bi bi-calendar2-grid text-primary me-2"></i>
                        <span id="dailySubtitle">Martes, 14 de Abril de 2026</span>
                    </p>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="week-nav d-flex align-items-center gap-2">
                        <button class="btn btn-week-nav" id="prevDay">
                            <i class="bi bi-chevron-left"></i>
                        </button>
                        <button class="btn btn-today">Hoy</button>
                        <button class="btn btn-week-nav" id="nextDay">
                            <i class="bi bi-chevron-right"></i>
                        </button>
                    </div>
                    <button class="btn btn-new-event border-0 shadow-sm">
                        <i class="bi bi-plus-lg me-1"></i> Nuevo Evento
                    </button>
                </div>
            </div>

            <div class="calendar-card">
                <!-- Header del día -->
                <div class="daily-header">
                    <span class="daily-day-name" id="dailyDayName">MARTES</span>
                    <span class="daily-day-num today-num" id="dailyDayNum">14</span>
                    <span class="daily-month" id="dailyMonth">Abril 2026</span>
                </div>

                <!-- Cuerpo con horas -->
                <div class="week-body-scroll">
                    <div class="daily-body-grid" id="dailyBody">
                        <!-- Generado por JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        for (let h = 0; h < 24; h++) {
            const hour = h.toString().padStart(2, '0') + ':00';
            const body = document.getElementById('dailyBody');

            const timeCell = document.createElement('div');
            timeCell.className = 'daily-time-cell';
            timeCell.textContent = hour;
            body.appendChild(timeCell);

            const cell = document.createElement('div');
            cell.className = 'daily-event-cell';
            const addBtn = document.createElement('span');
            addBtn.className = 'add-event-hint';
            addBtn.textContent = '+ Agregar evento';
            cell.appendChild(addBtn);
            body.appendChild(cell);
        }

        // Scroll al horario actual (~08:00)
        document.querySelector('.week-body-scroll').scrollTop = 8 * 60;
    </script>
</body>
</html>
