<!DOCTYPE html>
<html lang="es">
<head>
  <title>Calendorx - Login</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/login.css">
  <link rel="stylesheet" href="../assets/loader.css">
  <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.10/dist/dotlottie-wc.js" type="module"></script>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

  <div class="auth-card">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/>
        </svg>
      </div>
      <span class="brand-title">Calendorx</span>
      <span class="brand-sub">Organiza tu vida</span>
    </div>

    <!-- LOGIN -->
    <form id="formLogin">
      <p class="form-title">Iniciar Sesión</p>
      <div id="loginError" class="alert alert-danger" style="display:none;"></div>
      <div class="mb-3">
        <label class="form-label-sm">Correo electrónico</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <input type="email" placeholder="tu@email.com" name="email" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label-sm">Contraseña</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3.1-9H8.9V6a3.1 3.1 0 0 1 6.2 0v2z"/></svg>
          <input type="password" placeholder="••••••••" name="pswd" required>
        </div>
      </div>
      <button type="submit" class="btn-auth">Iniciar Sesión</button>
      <p class="switch-link">¿No tienes cuenta? <a onclick="toggleForms()">Regístrate aquí</a></p>
    </form>

    <!-- REGISTER -->
    <form id="formRegister" style="display:none">
      <p class="form-title">Crear Cuenta</p>
      <div id="registerError" class="alert alert-danger" style="display:none;"></div>
      <div class="mb-3">
        <label class="form-label-sm">Nombre Completo</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/></svg>
          <input type="text" placeholder="Tu Nombre" name="nombre" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label-sm">Correo Electrónico</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <input type="email" placeholder="tu@email.com" name="email" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label-sm">Contraseña</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3.1-9H8.9V6a3.1 3.1 0 0 1 6.2 0v2z"/></svg>
          <input type="password" placeholder="••••••••" id="regPwd" name="pswd" oninput="checkPwd()" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label-sm">Confirmar Contraseña</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3.1-9H8.9V6a3.1 3.1 0 0 1 6.2 0v2z"/></svg>
          <input type="password" placeholder="••••••••" id="regConfirm" name="pswdConfirm" oninput="checkPwd()" required>
        </div>
        <div class="pwd-checks">
          <div class="check-item" id="check8"><div class="check-dot"></div>Al menos 8 caracteres</div>
          <div class="check-item" id="checkMatch"><div class="check-dot"></div>Contraseñas coinciden</div>
        </div>
      </div>
      <button type="submit" class="btn-auth">Crear Cuenta</button>
      <p class="switch-link">¿Ya tienes cuenta? <a onclick="toggleForms()">Inicia sesión aquí</a></p>
    </form>
  </div>

  <script>
    function toggleForms() {
      const login = document.getElementById('formLogin');
      const reg = document.getElementById('formRegister');
      document.getElementById('loginError').style.display = 'none';
      document.getElementById('registerError').style.display = 'none';
      if (reg.style.display === 'none') { login.style.display = 'none'; reg.style.display = 'block'; }
      else { login.style.display = 'block'; reg.style.display = 'none'; }
    }
    function checkPwd() {
      const pwd = document.getElementById('regPwd').value;
      const confirm = document.getElementById('regConfirm').value;
      document.getElementById('check8').classList.toggle('pass', pwd.length >= 8);
      document.getElementById('checkMatch').classList.toggle('pass', pwd === confirm && pwd.length > 0);
    }
  </script>
  <!-- Loader Modal -->
  <div id="loaderModal">
    <div class="loader-container">
      <dotlottie-wc src="https://lottie.host/ebb9a977-8d74-4b6b-b098-941333c38336/ndW3uyGDJu.lottie" style="width: 200px; height: 200px;" autoplay loop></dotlottie-wc>
      <div class="loader-text">Cargando</div>
    </div>
  </div>

  <script src="../controllers/env.js"></script>
  <script src="../controllers/loader_utils.js"></script>
  <script src="../controllers/auth_controller.js"></script>
</body>
</html>
